---
ahoyapi: v2

commands:
  up:
    usage: Build project.
    cmd: |
      docker compose up -d "$@"

  down:
    usage: Delete project.
    cmd: docker compose down

  build:
    usage: Build project.
    cmd: |
      docker compose build "$@"

  restart:
    usage: Restart Docker containers.
    cmd: docker compose restart

  stop:
    usage: Stop Docker containers.
    cmd: docker compose stop "$@"

  watch:
    usage: Use Compose Watch for live development.
    cmd: docker compose watch

  cli:
    usage: Start a shell.
    cmd: docker compose exec govcms bash

  composer:
    usage: Start a composer command.
    cmd: docker compose exec govcms composer "$@"

  rector:
    usage: Analyze your code with Rector and review suggested changes.
    cmd: docker compose exec govcms rector "$@"

  phpunit:
    usage: Run PHPUnit tests.
    cmd: docker compose exec govcms sudo -u root -E sudo -u www-data -E /app/bin/phpunit "$@"

  phpstan:
  usage: Check for Drupal deprecations and basic static-analysis errors.
  cmd: docker compose exec govcms phpstan analyse --level=2 "$@"

  phpstan-analysis:
  usage: Run broader Drupal-aware static analysis with stricter type checking.
  cmd: docker compose exec govcms phpstan analyse --level=6 "$@"
