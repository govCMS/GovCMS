version: '2.1'

orbs:
  tests: 'govcms/tests@4'

workflows:
  test:
    jobs:
      - tests/validate_composer:
          pre-steps:
            - run:
                name: Upgrade Composer to latest version
                command: composer self-update
      - tests/drupal_practices:
          pre-steps:
            - run:
                name: Upgrade Composer to latest version
                command: composer self-update
      - tests/build:
          pre-steps:
            - run:
                name: Upgrade Composer to latest version
                command: composer self-update
          requires:
            - tests/validate_composer
      - tests/basic:
          requires:
            - tests/build
      - tests/phpunit:
          requires:
            - tests/build
      - tests/cypress:
          requires:
            - tests/build
