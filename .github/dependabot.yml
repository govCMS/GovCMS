version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Australia/Sydney"
    groups:
      drupal-core:
        applies-to: version-updates
        patterns:
          - "drupal/core*"
    open-pull-requests-limit: 50
    target-branch: "3.x-develop"
    labels:
      - drupal10
      - dependencies
    ignore:
      - dependency-name: "drupal/core*"
        versions: ["11.x"]
    commit-message:
      prefix: "[GOVCMSD10] "